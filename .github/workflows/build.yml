name: VanishKey Multi-Platform CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Test Server & Relay Hub
  # -------------------------------------------------------------
  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test Server & CLI Agent E2E
        run: |
          cd server && npm install
          cd ../agent-cli && npm install
          npm run test-e2e

      - name: Build Docker Container
        run: |
          docker build -t vanishkey-relay:latest ./server

  # -------------------------------------------------------------
  # Job 2: Build Android (APK / AAB)
  # -------------------------------------------------------------
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold & Build Android Release APK
        working-directory: mobile_app
        run: |
          flutter create --platforms=android .
          # Ensure FlutterFragmentActivity for Android Fingerprint / BiometricPrompt
          sed -i 's/FlutterActivity/FlutterFragmentActivity/g' android/app/src/main/kotlin/*/*/*/MainActivity.kt || true
          sed -i 's/FlutterActivity/FlutterFragmentActivity/g' android/app/src/main/kotlin/*/*/MainActivity.kt || true
          # Ensure minSdk is 23 for biometric & security plugins
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 23/' android/app/build.gradle || true
          sed -i 's/flutter.minSdkVersion/23/' android/app/build.gradle || true
          # Strip package attribute from AndroidManifest.xml (AGP 8+ requirement)
          sed -i 's/package="[^"]*"//g' android/app/src/main/AndroidManifest.xml || true
          # Add MLKit & CameraX ProGuard rules to prevent R8 reflection crashes
          cat << 'EOF' >> android/app/proguard-rules.pro
          -keep class com.google.mlkit.** { *; }
          -keep class com.google.android.gms.internal.mlkit_vision_barcode.** { *; }
          -keep class com.google.android.gms.internal.mlkit_** { *; }
          -keep class com.google.android.libraries.barhopper.** { *; }
          -keep class dev.steenbakker.mobile_scanner.** { *; }
          -keep class androidx.camera.** { *; }
          -keepclassmembers enum * { *; }
          -dontwarn com.google.mlkit.**
          -dontwarn dev.steenbakker.mobile_scanner.**
          EOF
          flutter pub get
          flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: VanishKey-Android-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk

  # -------------------------------------------------------------
  # Job 3: Build Windows Desktop Host (.exe)
  # -------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Scaffold & Build Windows Executable
        working-directory: desktop_agent
        run: |
          flutter create --platforms=windows .
          flutter pub get
          flutter build windows --release

      - name: Package Windows Portable Release (Zip)
        run: |
          New-Item -ItemType Directory -Force -Path dist\windows
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /target:winexe /win32manifest:windows-app/app.manifest /r:System.dll,System.Drawing.dll,System.Windows.Forms.dll /out:dist\windows\VanishKeyHost.exe windows-app/VanishKeyHost.cs
          Compress-Archive -Path desktop_agent\build\windows\x64\runner\Release\* -DestinationPath dist\windows\VanishKey-Windows-Portable.zip -Force

      - name: Upload Windows Host Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VanishKey-Windows-App
          path: |
            dist/windows/VanishKey-Windows-Portable.zip
            dist/windows/VanishKeyHost.exe
            desktop_agent/build/windows/x64/runner/Release/vanishkey_desktop_agent.exe

  # -------------------------------------------------------------
  # Job 4: Create GitHub Release with Direct Download Links
  # -------------------------------------------------------------
  create-release:
    needs: [build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: VanishKey-Android-APK
          path: release-assets/android

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: VanishKey-Windows-App
          path: release-assets/windows

      - name: Publish GitHub Release (v1.0.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "VanishKey ${{ github.ref_name }} Release"
          body: |
            ## VanishKey ${{ github.ref_name }}
            
            Zero-knowledge, time-limited ephemeral laptop access for shared rooms & dorms.
            
            ### Downloads:
            - 📱 **Android Mobile App:** `app-release.apk` (Direct install / sideload)
            - 💻 **Windows Desktop Host App (New):** `VanishKeyHost.exe` (Native GUI & System Tray with Live QR)
            - 💻 **Windows Portable Bundle:** `VanishKey-Windows-Portable.zip`
          files: |
            release-assets/android/app-release.apk
            release-assets/windows/VanishKeyHost.exe
            release-assets/windows/VanishKey-Windows-Portable.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
